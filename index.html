<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
    </style>
</head>
<body>
    <h1>Redirecting you to KayVee...</h1>
    <p>Please wait while we log you in.</p>
    <p>If you aren't redirected automatically, <a id="manual-link">click here to open the app</a>.</p>

    <script>
        // 1. Capture the query parameters from the URL (e.g., ?token=xyz&account=...)
        const params = window.location.search;

        // 2. Define your app's custom scheme
        // IMPORTANT: Ensure 'kayvee' matches the scheme defined in your Expo app.json
        const targetUrl = 'kayvee://login' + params;

        // 3. Update the manual link for the user
        const link = document.getElementById('manual-link');
        link.href = targetUrl;

        // 4. Attempt the automatic redirect
        window.location.href = targetUrl;
    </script>
</body>
</html>
