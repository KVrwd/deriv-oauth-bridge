<!DOCTYPE html>
<html>
<body>
    <h1 id="status">Loading...</h1>
    <script>
        const params = window.location.search;
        const status = document.getElementById('status');
        
        if (params.includes('token')) {
            status.innerText = "Token found! Redirecting...";
            const targetUrl = 'kayvee://login' + params;
            window.location.href = targetUrl;
        } else {
            status.innerText = "No token found in URL. Check Deriv settings.";
            console.log("Current URL params:", params);
        }
    </script>
</body>
</html>
